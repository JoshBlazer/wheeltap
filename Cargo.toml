[package]
name = "wheeltap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Static analysis for Rust-based Solana smart contracts (Anchor)"
readme = "README.md"
keywords = ["solana", "anchor", "security", "static-analysis", "sast"]
categories = ["development-tools", "command-line-utilities"]

# The root package is the installable binary, so that both
#   cargo install --path .
#   cargo install wheeltap
# resolve to this crate. The analysis lives in the workspace libraries below.
[[bin]]
name = "wheeltap"
path = "src/main.rs"

[dependencies]
wheeltap-cli = { version = "0.1.0", path = "crates/wheeltap-cli" }

# Integration tests live in `tests/` and exercise the analysis directly.
[dev-dependencies]
wheeltap-core.workspace = true
wheeltap-report.workspace = true
wheeltap-rules.workspace = true
insta.workspace = true
jsonschema.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[workspace]
members = ["crates/*"]
# Fixtures and vendored corpus programs carry their own manifests and are inputs
# to the analyser, not members of this build. Some of them do not compile by
# design.
exclude = ["fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JoshBlazer/wheeltap"

[workspace.dependencies]
wheeltap-core = { version = "0.1.0", path = "crates/wheeltap-core" }
wheeltap-rules = { version = "0.1.0", path = "crates/wheeltap-rules" }
wheeltap-report = { version = "0.1.0", path = "crates/wheeltap-report" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
# `proc-macro` is off deliberately: Wheeltap is a CLI, never a procedural macro,
# and the feature drags in `proc_macro::Span`, which is unusable off the compiler
# thread. `span-locations` is what gives us line and column (ADR-004).
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "3", default-features = false, features = [
    "full",
    "parsing",
    "printing",
    "clone-impls",
    "extra-traits",
    "visit",
] }
thiserror = "2"
toml = "1"

insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.49", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[lints]
workspace = true

[profile.release]
lto = "thin"
