name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-features

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Read the MSRV from the workspace manifest so it cannot drift from the
      # version we claim to support. Match only the quoted assignment: the
      # [package] section inherits with `rust-version.workspace = true`, which
      # a looser pattern picks up first and passes downstream as a toolchain
      # name. Fail loudly rather than resolving to something meaningless.
      - name: Resolve MSRV
        id: msrv
        run: |
          msrv=$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          if [[ ! $msrv =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::could not parse an MSRV from Cargo.toml (got '$msrv')"
            exit 1
          fi
          echo "Resolved MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # rust-toolchain.toml pins `stable` for contributors; honouring it here
      # would silently defeat the point of this job.
      - name: Drop the toolchain pin
        run: rm rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - name: Build on MSRV
        run: cargo build --workspace
